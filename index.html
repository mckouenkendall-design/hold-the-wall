<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hold the Wall"><meta name="theme-color" content="#07060b"><title>Hold the Wall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* One fixed 1280x720 stage scaled to fit the window: painted world underneath, parchment-and-gilt interface on top. Single dark look by design. */
:root{
 --void:#07060b; --panel:rgba(17,14,26,.9); --panel2:rgba(30,25,44,.94); --line:rgba(226,190,120,.26); --line2:rgba(226,190,120,.62);
 --text:#efe6d2; --dim:#a8a08f; --gold:#f2c14e; --renown:#9fd8ff; --danger:#ef6f5a; --good:#7ddc8a; --steel:#9fb0c8;
 --display:'Cinzel','Trajan Pro','Palatino Linotype',Georgia,serif; --body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
 color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
textarea{-webkit-user-select:text;user-select:text;touch-action:auto}
#sheetBody .seg button{font-size:14px;padding:8px 14px;border-radius:18px}.seg button.off{opacity:.35;cursor:default}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin:12px 0;max-height:250px;overflow-y:auto;padding:2px}
.wgrid button{font:800 15px var(--body);color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:9px 0;cursor:pointer;position:relative}
.wgrid button.boss{color:var(--danger)}.wgrid button.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.wgrid button.no{opacity:.28;cursor:default}
.wgrid button.cp::after{content:'';position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--good)}
.recap{margin:10px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(239,111,90,.07)}
.recap .rrow{display:grid;grid-template-columns:30px 150px 1fr 44px;align-items:center;gap:8px;margin-top:5px}
.recap .rrow img,.recap .rph{width:30px;height:30px;object-fit:contain}
.recap .rbar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.recap .rbar i{display:block;height:100%;background:var(--danger);border-radius:4px}
.recap .rpc{text-align:right;font-weight:800}
#wrap{position:fixed;inset:0;overflow:hidden;background:var(--void)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden}
#cv{position:absolute;inset:0;width:1280px;height:720px;display:block;cursor:none}
#cv.plain{cursor:default}
#hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
#hud>*{pointer-events:auto}
img.ic{vertical-align:-3px;pointer-events:none}
kbd{font-family:var(--body);font-size:11px;font-weight:700;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;background:rgba(0,0,0,.3)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
.lbl{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.dim{color:var(--dim)}.goldc{color:var(--gold)}.renc{color:var(--renown)}.bad{color:var(--danger)}.goodc{color:var(--good)}
.btn{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--text);background:linear-gradient(#2c2540,#1b1629);border:1px solid var(--line2);border-radius:8px;padding:9px 14px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .08s,filter .12s,box-shadow .12s;white-space:nowrap}
.btn:hover{filter:brightness(1.22);box-shadow:0 3px 14px rgba(242,193,78,.22),inset 0 1px 0 rgba(255,255,255,.1)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.ibtn:focus-visible,.pow:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:linear-gradient(#c9973a,#8d6220);border-color:#ffe2a0;color:#1a1206;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.btn.primary kbd{color:#3a2a0c;border-color:rgba(0,0,0,.35);background:rgba(255,255,255,.2)}
.btn.big{font-size:16px;padding:13px 22px}
.btn.small{font-size:11px;padding:6px 10px}
.btn.ghost{background:rgba(20,16,30,.5);border-color:var(--line)}
.btn.danger{border-color:rgba(239,111,90,.6);color:#ffc5ba}
.btn[disabled],.btn.off{opacity:.45;filter:grayscale(.5);cursor:not-allowed}
.btn .sub{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;opacity:.85;margin-top:2px}
.ibtn{width:32px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font-family:var(--display);font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ibtn:hover{border-color:var(--line2);filter:brightness(1.3)}
.ibtn.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(242,193,78,.3)}
.bar{position:relative;height:13px;border-radius:7px;background:#0b0910;border:1px solid rgba(255,255,255,.12);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .18s}
.bar.thin{height:7px}

#wallBox{position:absolute;left:16px;top:14px;width:306px;padding:9px 12px;display:flex;gap:10px;align-items:center}
#wallBox .col{flex:1;min-width:0}
#wallBox .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
#wallTxt{font-weight:800;font-size:15px}
#wallFill{background:linear-gradient(#8fe08a,#3f9a4a);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
#wallBox.mid #wallFill{background:linear-gradient(#f2d06a,#c08a20)}
#wallBox.low #wallFill{background:linear-gradient(#ff8a6a,#c0382a)}
#wallBox.low{animation:alarm 1s infinite}
@keyframes alarm{50%{border-color:var(--danger);box-shadow:0 0 22px rgba(239,111,90,.5)}}

#waveBox{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:280px;text-align:center;pointer-events:none!important}
#waveTitle{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.1em;text-shadow:0 2px 12px rgba(0,0,0,.8),0 0 2px #000;line-height:1.1}
#waveSub{font-size:13px;font-weight:500;color:#e6dcc4;text-shadow:0 1px 6px rgba(0,0,0,.9),0 0 2px #000;margin:1px 0 6px}
#waveBox .bar{width:240px;margin:0 auto}
#waveFill{background:linear-gradient(#ffd98a,#d9902a)}
#bossBar{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:520px;text-align:center;pointer-events:none!important}
#bossName{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.16em;color:#ffb3a5;text-shadow:0 2px 8px #000}
#bossBar .bar{height:15px;border-color:rgba(239,111,90,.6);margin-top:3px}
#bossFill{background:linear-gradient(#ff7a5a,#a82418)}

#resBox{position:absolute;right:14px;top:14px;display:flex;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:17px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:16px}
.chip.gold{color:var(--gold)}.chip.ren{color:var(--renown)}
#btnTree{position:relative;padding:8px 13px}
#btnTree .dot{position:absolute;right:-5px;top:-5px;width:13px;height:13px;border-radius:50%;background:var(--renown);box-shadow:0 0 12px var(--renown);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.35)}}

#powers{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:14px;background:rgba(12,10,20,.6);border:1px solid var(--line)}
.pow{position:relative;width:56px;height:56px;border-radius:11px;border:1px solid var(--line2);background:radial-gradient(circle at 50% 30%,#35294f,#15111f);cursor:pointer;padding:0;overflow:hidden}
.pow img{width:32px;height:32px;position:absolute;left:12px;top:9px;pointer-events:none}
.pow .key{position:absolute;left:4px;top:2px;font-size:11px;font-weight:800;color:var(--dim)}
.pow .cd{position:absolute;inset:0;background:conic-gradient(rgba(6,4,12,.82) calc(var(--p)*1%),transparent 0);pointer-events:none}
.pow .sec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;text-shadow:0 1px 4px #000;pointer-events:none}
.pow.ready{box-shadow:0 0 12px rgba(242,193,78,.28)}
.pow.armed{border-color:#fff;box-shadow:0 0 0 2px #fff,0 0 18px rgba(255,255,255,.6)}
.pow.buff{border-color:var(--gold);box-shadow:0 0 16px var(--gold)}
.pow:hover{filter:brightness(1.25)}

#buildBar{position:absolute;left:16px;bottom:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:400px}
#buildBar .row{display:flex;gap:8px;align-items:stretch}
#nextBox{padding:8px 11px}
#nextChips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;max-width:372px}
.ech{display:inline-flex;align-items:center;gap:1px;padding:1px 8px 1px 1px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-weight:800;font-size:13px;cursor:help}
.ech img{width:28px;height:28px;filter:invert(1) brightness(1.6);pointer-events:none}
.ech.boss{border-color:var(--danger);color:#ffb3a5;background:rgba(239,111,90,.14)}
.ech.new{border-color:var(--gold)}
#hint{position:absolute;left:50%;top:86px;transform:translateX(-50%);padding:6px 16px;border-radius:16px;background:rgba(12,10,20,.72);border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap;pointer-events:none!important}

#panel{position:absolute;right:16px;top:60px;width:312px;max-height:560px;overflow-y:auto;padding:12px;scrollbar-width:thin}
.phead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.phead h3{margin:2px 0 0;font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:.04em}
.xbtn{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-weight:800;line-height:1}
.xbtn:hover{color:#fff;border-color:var(--line2)}
.rec{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 9px 6px 4px;margin-top:6px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:var(--body);cursor:pointer}
.rec:hover{border-color:var(--gold);filter:brightness(1.18)}
.rec img.port{width:44px;height:44px;flex:none;background:radial-gradient(circle at 50% 60%,#5d6f96,#2a3350);border-radius:8px;pointer-events:none}
.rec b{font-size:15px}.rec small{display:block;color:var(--dim);font-size:12px;line-height:1.25}
.rec .cost{margin-left:auto;font-weight:800;color:var(--gold);white-space:nowrap;padding-left:6px}
.rec.poor .cost{color:var(--danger)}.rec.poor{opacity:.75}
.rec.locked{opacity:.5;cursor:default;border-style:dashed}.rec.locked:hover{border-color:var(--line);filter:none}
.ucard{display:flex;gap:11px;align-items:center}
.ucard img.port{width:64px;height:64px;background:radial-gradient(circle at 50% 60%,#5d6f96,#2a3350);border-radius:10px;border:1px solid var(--line)}
.pips{letter-spacing:2px;color:var(--gold)}
.stats{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:10px 0;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.28);font-size:13px}
.stats b{text-align:right}
.blurb{font-size:13px;line-height:1.35;color:#d8cfba;margin-bottom:10px}
.spec{border:1px solid var(--line2);border-radius:9px;padding:9px;margin-top:7px;background:var(--panel2)}
.spec h4{margin:0 0 3px;font-family:var(--display);font-size:14px}
.spec p{margin:0 0 7px;font-size:12.5px;line-height:1.3;color:#d8cfba}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 10px}
.seg button{font-family:var(--body);font-size:12px;font-weight:700;padding:4px 9px;border-radius:13px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer}
.seg button.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.wfull{width:100%}

#relics{position:absolute;left:16px;top:78px;display:flex;gap:5px;flex-wrap:wrap;max-width:320px}
.rel{width:28px;height:28px;border-radius:7px;background:var(--panel);border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;cursor:help}
.mut{font-family:var(--body);font-weight:800;letter-spacing:0;text-transform:none;font-size:12px;padding:1px 8px;border:1px solid currentColor;border-radius:10px;margin-left:4px;cursor:help}
#toasts{position:absolute;left:16px;top:114px;display:flex;flex-direction:column;gap:6px;pointer-events:none!important;align-items:flex-start}
.toast{padding:6px 13px;border-radius:8px;background:var(--panel);border:1px solid var(--line2);font-weight:700;font-size:14px;animation:toast 3.4s forwards}
@keyframes toast{0%{opacity:0;transform:translateX(-14px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.ecard{display:flex;gap:10px;align-items:center;width:330px;padding:8px 12px 8px 8px;border-radius:10px;background:var(--panel);border:1px solid var(--gold);animation:ecard 9s forwards;pointer-events:none}
.ecard img{width:58px;height:58px;filter:invert(1) brightness(1.6);flex:none}
.ecard b{font-family:var(--display);font-size:15px}.ecard p{margin:2px 0 0;font-size:12.5px;line-height:1.3;color:#d8cfba}
@keyframes ecard{0%{opacity:0;transform:translateX(20px)}5%{opacity:1;transform:none}92%{opacity:1}100%{opacity:0}}
#cards{position:absolute;right:16px;bottom:14px;display:flex;flex-direction:column;gap:6px;pointer-events:none!important;align-items:flex-end}
#banner{position:absolute;left:0;right:0;top:150px;text-align:center;pointer-events:none!important;opacity:0}
#banner.show{animation:banner 3s forwards}
#banner h2{margin:0;font-family:var(--display);font-weight:800;font-size:54px;letter-spacing:.14em;text-shadow:0 4px 26px rgba(0,0,0,.9),0 0 3px #000}
#banner p{margin:2px 0 0;font-size:19px;font-weight:500;text-shadow:0 2px 10px #000,0 0 3px #000}
@keyframes banner{0%{opacity:0;letter-spacing:.4em}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
#tip{position:absolute;max-width:270px;padding:8px 11px;border-radius:8px;background:rgba(10,8,16,.96);border:1px solid var(--line2);font-size:13px;line-height:1.35;pointer-events:none;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.6)}
#tip b{font-family:var(--display);font-size:13px;letter-spacing:.04em;display:block;margin-bottom:2px}
#pausedTag{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.3em;text-shadow:0 4px 24px #000;pointer-events:none!important}

.screen{position:absolute;inset:0;z-index:20}
#title{background:linear-gradient(90deg,rgba(7,6,11,0) 20%,rgba(7,6,11,.55) 55%,rgba(7,6,11,.9));display:flex;align-items:center;justify-content:flex-end}
.titleInner{width:520px;margin-right:84px;text-align:left}
.kicker{font-family:var(--display);letter-spacing:.3em;font-size:12px;text-transform:uppercase;color:var(--gold)}
#title h1{margin:8px 0 26px;font-family:var(--display);font-weight:800;font-size:92px;line-height:.9;letter-spacing:.04em;text-shadow:0 6px 40px rgba(0,0,0,.8);color:#fff4d8}
#title h1 span{display:block;font-size:28px;letter-spacing:.6em;font-weight:600;color:var(--gold);margin:6px 0 4px 4px}
.menu{display:flex;flex-direction:column;gap:10px;width:330px}
.menu .btn{text-align:left;display:flex;justify-content:space-between;align-items:center}
.pill{font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:0;padding:2px 9px;border-radius:10px;background:rgba(0,0,0,.35);color:var(--gold)}
.foot{margin-top:22px;color:var(--dim);font-size:13px}
.shade{z-index:30;background:rgba(6,5,10,.9);display:flex;align-items:center;justify-content:center}
.sheet{width:820px;max-height:640px;overflow:auto;padding:26px 30px}
.sheet h2{margin:0 0 4px;font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.1em}
.sheet h3{font-family:var(--display);font-size:15px;letter-spacing:.1em;margin:16px 0 4px;color:var(--gold)}
.sheet p{margin:4px 0;line-height:1.45;font-size:14.5px;color:#ddd4bf}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.stat{padding:12px;border-radius:9px;background:rgba(0,0,0,.3);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:24px;font-weight:800}
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.perk{padding:11px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.perk h4{margin:0;font-family:var(--display);font-size:13.5px;display:flex;gap:6px;align-items:center}
.perk p{font-size:12.5px;margin:0;flex:1}
.rowr{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:14px}

#tree{background:#0a0812}
#treeCv{position:absolute;inset:0;width:1280px;height:720px;cursor:grab}
#treeCv.drag{cursor:grabbing}
#treeTop{position:absolute;left:18px;top:14px;display:flex;align-items:center;gap:14px;pointer-events:none}
#treeTop h2{margin:0;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.14em}
#treeTop .chip{font-size:20px;height:40px}
#treeHelp{position:absolute;left:18px;bottom:14px;color:var(--dim);font-size:13px;pointer-events:none}
#treeClose{position:absolute;right:16px;top:14px}
#treeInfo{position:absolute;right:16px;top:66px;width:296px;padding:16px}
#treeInfo h3{margin:6px 0 6px;font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:.03em}
#treeInfo p{margin:0 0 12px;line-height:1.4;font-size:14.5px;color:#e2d9c4}
.bchip{display:inline-block;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:2px 9px;border-radius:10px;border:1px solid currentColor}
.leads{font-size:13px;color:var(--dim);margin-top:12px;line-height:1.5}
.leads b{color:var(--text);font-weight:700}
#treeLegend{position:absolute;right:16px;bottom:14px;display:flex;gap:10px;font-size:12px;font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;pointer-events:none}
#treeLegend span{display:inline-flex;align-items:center;gap:5px}
#treeLegend i{width:9px;height:9px;border-radius:50%;display:inline-block}
@media (prefers-reduced-motion:reduce){.toast,.ecard,#banner.show{animation-duration:.01s;animation-fill-mode:forwards}#wallBox.low,#btnTree .dot{animation:none}}
</style>
<div id="wrap"><div id="stage">
 <canvas id="cv"></canvas>
 <div id="hud" hidden>
  <div id="wallBox" class="box"><img id="wallIc" class="ic" alt="" style="width:30px;height:30px"><div class="col"><div class="row"><span class="lbl">The Wall</span><span id="wallTxt"></span></div><div class="bar"><i id="wallFill"></i></div></div></div>
  <div id="waveBox"><div id="waveTitle"></div><div id="waveSub"></div><div class="bar thin" id="waveBar"><i id="waveFill"></i></div></div>
  <div id="bossBar" hidden><div id="bossName"></div><div class="bar"><i id="bossFill"></i></div></div>
  <div id="resBox">
   <div class="chip gold" id="goldChip"><span id="goldIc"></span><span id="goldTxt"></span></div>
   <div class="chip ren" id="renChip"><span id="renIc"></span><span id="renTxt"></span></div>
   <button class="btn" id="btnTree" type="button">Research<kbd>T</kbd><i class="dot" id="treeDot" hidden></i></button>
   <button class="ibtn" id="btnSpeed" type="button">1x</button>
   <button class="ibtn" id="btnPause" type="button"></button>
   <button class="ibtn" id="btnAuto" type="button">Auto</button>
   <button class="ibtn" id="btnSound" type="button"></button>
   <button class="ibtn" id="btnMenu" type="button">?</button>
  </div>
  <div id="relics"></div>
  <div id="toasts"></div>
  <div id="cards"></div>
  <div id="banner"><h2 id="bannerH"></h2><p id="bannerP"></p></div>
  <div id="pausedTag" hidden>PAUSED</div>
  <div id="hint" hidden></div>
  <div id="buildBar">

const SFX=(()=>{
 let ac=null,master=null,musicGain=null,sfxGain=null,noiseBuf=null,on=true,musicOn=true,last={},musicT=0,step=0,started=false;
 function init(){
  if(ac)return;
  try{
   ac=new (window.AudioContext||window.webkitAudioContext)();
   master=ac.createGain();master.gain.value=.5;
   const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;
   master.connect(comp);comp.connect(ac.destination);
   sfxGain=ac.createGain();sfxGain.gain.value=1;sfxGain.connect(master);
   musicGain=ac.createGain();musicGain.gain.value=.5;musicGain.connect(master);
   noiseBuf=ac.createBuffer(1,ac.sampleRate*1.5,ac.sampleRate);
   const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
   started=true;
  }catch(e){ac=null}
 }
 function resume(){init();if(ac&&ac.state==='suspended')ac.resume()}
 function ok(name,gap){if(!ac||!on)return false;const t=ac.currentTime;if(last[name]&&t-last[name]<gap)return false;last[name]=t;return true}
 function tone(type,f0,f1,dur,vol,delay,dest){
  const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||sfxGain);o.start(t);o.stop(t+dur+.02);
 }
 function noise(dur,vol,type,f0,f1,delay,q){
  const t=ac.currentTime+(delay||0),s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;s.playbackRate.value=.8+Math.random()*.4;f.type=type;f.Q.value=q||.8;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(sfxGain);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
 }

 },
 /* stick figure flies apart into loose limbs */
 ragdoll(x,gy,s,ink,dir,force,head){

  const f=force||1,mk=(ox,oy,len,w)=>this.gibs.push({x:x+ox*s,y:gy+oy*s,vx:dir*rand(30,170)*f+rand(-50,50),vy:-rand(90,300)*f,len:len*s,rot:rand(TAU),vr:rand(-14,14),life:rand(2.2,3.2),col:ink,w:w*s,gy:gy+rand(-2,6),r:0});

  const D=this.decals;for(let i=D.length-1;i>=0;i--){D[i].life-=dt;if(D[i].life<=0)D.splice(i,1)}

 },
 drawDecals(c){

   if(d.kind==='arrow'){c.strokeStyle=d.col||'#2a1d12';c.lineWidth=1.6;c.beginPath();c.moveTo(d.x,d.y);c.lineTo(d.x-Math.cos(d.rot)*13,d.y-Math.sin(d.rot)*13);c.stroke()}
   else if(d.kind==='scorch'){c.globalAlpha=a*.5;c.fillStyle='#120d0c';c.beginPath();c.ellipse(d.x,d.y,d.size,d.size*.2,0,0,TAU);c.fill();c.globalAlpha=a*.35;c.beginPath();c.ellipse(d.x,d.y,d.size*.6,d.size*.12,0,0,TAU);c.fill()}
   else if(d.kind==='crater'){c.fillStyle='rgba(20,14,10,.55)';c.beginPath();c.ellipse(d.x,d.y,d.size,d.size*.2,0,0,TAU);c.fill();c.fillStyle='rgba(255,255,255,.07)';c.beginPath();c.ellipse(d.x,d.y+d.size*.06,d.size*.8,d.size*.1,0,0,Math.PI);c.fill()}
   else if(d.kind==='ice'){c.fillStyle='rgba(190,235,255,.45)';c.beginPath();c.ellipse(d.x,d.y,d.size,d.size*.2,0,0,TAU);c.fill()}}

 drawGibs(c){

   else if(p.shape===2){const s=lerp(p.size2,p.size,t);c.globalAlpha=(p.a||.4)*Math.min(1,t*1.6)*Math.min(1,(1-t)*6);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,s,0,TAU);c.fill()}

   else{const s=p.size2!==undefined?lerp(p.size2,p.size,t):p.size;c.globalAlpha=Math.min(1,t*2);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,Math.max(.3,s),0,TAU);c.fill()}}

 },

R.init=function(cv){

 this.wcv=document.createElement('canvas');this.wctx=this.wcv.getContext('2d');
 this.lcv=document.createElement('canvas');this.lcv.width=W/2;this.lcv.height=H/2;this.lctx=this.lcv.getContext('2d');
 const r=mulberry(77);
 for(let i=0;i<170;i++)this.stars.push({x:r()*W,y:r()*470,s:.5+r()*1.5,p:r()*TAU,b:.4+r()*.6});
 for(let i=0;i<8;i++){const blobs=[];const n=4+(r()*4|0);for(let j=0;j<n;j++)blobs.push({x:(j-n/2)*26+r()*14,y:r()*14-7,rx:30+r()*34,ry:12+r()*12});this.clouds.push({x:r()*(W+400)-200,y:50+r()*250,s:.6+r()*1.1,v:3+r()*7,blobs})}

R.resize=function(rs){this.rs=rs;this.cv.width=Math.round(W*rs);this.cv.height=Math.round(H*rs);this.wcv.width=this.cv.width;this.wcv.height=this.cv.height;this.castleKey=''};

const groundY=x=>562+Math.sin(x*.011+1)*4+Math.sin(x*.031)*2;

R.buildScenery=function(bi){
 const b=BIOMES[bi],r=mulberry(1000+bi*97),S={};
 const ph=[r()*TAU,r()*TAU,r()*TAU,r()*TAU,r()*TAU,r()*TAU];
 const mount=(base,amp,f,k)=>x=>base-amp*((1-Math.abs(Math.sin(x*f+ph[k])))*.62+(1-Math.abs(Math.sin(x*f*2.3+ph[k+1])))*.3+Math.sin(x*f*7+ph[k+2])*.04);
 const hill=(base,amp,f,k)=>x=>base-amp*(.5+.5*Math.sin(x*f+ph[k]))*.7-amp*.3*Math.sin(x*f*2.7+ph[k+1]);
 const path=(fn,step)=>{const p=new Path2D();p.moveTo(-30,H);for(let x=-30;x<=W+30;x+=step)p.lineTo(x,fn(x));p.lineTo(W+30,H);p.closePath();return p};
 const fFar=mount(470,230,.0042,0),fFar2=mount(500,150,.0061,2),fMid=hill(520,70,.0052,1),fNear=hill(552,46,.0078,3);
 S.far=path(fFar,10);S.far2=path(fFar2,10);S.mid=path(fMid,12);S.near=path(fNear,12);
 // snow line for the far range (clipped to the mountains when drawn)
 let top=999;for(let x=-30;x<=W+30;x+=10)top=Math.min(top,fFar(x));
 S.caps=new Path2D();S.caps.moveTo(-30,0);S.caps.lineTo(W+30,0);
 for(let x=W+30;x>=-30;x-=14){const k=((x/14)|0)%2;S.caps.lineTo(x,top+46+Math.sin(x*.021)*14+(k?9:-5))}
 S.caps.closePath();
 const tree=(p,ps,x,y,h,kind)=>{
  if(kind==='pine'||kind==='snowpine'){const w=h*.36;for(let i=0;i<3;i++){const ty=y-h*(.28+i*.24),tw=w*(1-i*.24);p.moveTo(x-tw,ty+h*.26);p.lineTo(x,ty-h*.2);p.lineTo(x+tw,ty+h*.26);p.closePath()}p.rect(x-h*.035,y-h*.15,h*.07,h*.18)}
  else if(kind==='oak'){p.rect(x-h*.05,y-h*.45,h*.1,h*.5);for(let i=0;i<5;i++){const a=i/5*TAU,rr=h*.24;p.moveTo(x+Math.cos(a)*rr*.8+rr,y-h*.66+Math.sin(a)*rr*.6);p.arc(x+Math.cos(a)*rr*.8,y-h*.66+Math.sin(a)*rr*.6,rr,0,TAU)}}
  else{const br=(x0,y0,a,l,d)=>{const x1=x0+Math.cos(a)*l,y1=y0+Math.sin(a)*l;ps.moveTo(x0,y0);ps.lineTo(x1,y1);if(d>0){br(x1,y1,a-.5-r()*.4,l*.62,d-1);br(x1,y1,a+.45+r()*.4,l*.6,d-1)}};br(x,y+4,-Math.PI/2+(r()-.5)*.3,h*.42,3)}
 };
 S.midTrees=new Path2D();S.midStroke=new Path2D();
 for(let x=-10;x<W+20;x+=10+r()*26){if(r()<.25)continue;tree(S.midTrees,S.midStroke,x,fMid(x)+3,22+r()*26,b.tree)}
 S.nearTrees=new Path2D();S.nearStroke=new Path2D();
 for(let x=330;x<W+30;x+=26+r()*70){if(r()<.35&&x<1120)continue;tree(S.nearTrees,S.nearStroke,x,fNear(x)+4,46+r()*52,b.tree)}
 for(let x=1130;x<W+40;x+=14+r()*16)tree(S.nearTrees,S.nearStroke,x,fNear(x)+6+r()*10,80+r()*70,b.tree);
 S.groundTop=path(groundY,16);
 // --- static ground props, painted once
 const gc=document.createElement('canvas');gc.width=W*2;gc.height=220*2;const c=gc.getContext('2d');c.scale(2,2);c.translate(0,-510);
 // road
 const g2=c.createLinearGradient(0,566,0,640);g2.addColorStop(0,rgba(b.road,0));g2.addColorStop(.25,rgba(b.road,.75));g2.addColorStop(.75,rgba(b.road,.75));g2.addColorStop(1,rgba(b.road,0));
 c.fillStyle=g2;c.fillRect(0,566,W,74);
 // ruts and pebbles
 for(let i=0;i<150;i++){const x=r()*W,y=578+r()*52;c.fillStyle=rgba(r()<.5?'#000000':'#ffffff',.05+r()*.06);c.beginPath();c.ellipse(x,y,2+r()*9,1+r()*1.6,0,0,TAU);c.fill()}
 c.strokeStyle=rgba('#000000',.07);c.lineWidth=2;for(const yy of[592,612]){c.beginPath();for(let x=WALL_X;x<=W;x+=20)c.lineTo(x,yy+Math.sin(x*.02+yy)*2.5);c.stroke()}
 // stones
 for(let i=0;i<26;i++){const x=WALL_X+20+r()*(W-WALL_X-20),y=r()<.5?566+r()*10:634+r()*40,s=3+r()*8;c.fillStyle=mix(b.ground[1],'#8a8a92',.5);c.beginPath();c.ellipse(x,y,s,s*.6,0,Math.PI,0);c.fill();c.fillStyle=rgba('#ffffff',.14);c.beginPath();c.ellipse(x-s*.2,y-s*.2,s*.5,s*.25,0,Math.PI,0);c.fill()}

 const tuft=(x,y,h,colr)=>{c.strokeStyle=colr;c.lineWidth=1.4;c.lineCap='round';for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(x+k*1.6,y);c.quadraticCurveTo(x+k*2.5,y-h*.6,x+k*4+(r()-.5)*3,y-h*(.7+r()*.3));c.stroke()}};
 for(let x=WALL_X+4;x<W;x+=5+r()*9)tuft(x,groundY(x)+2,5+r()*7,mix(b.grass,b.ground[0],r()*.5));
 for(let i=0;i<120;i++){const x=WALL_X+10+r()*(W-WALL_X-10),y=r()<.45?566+r()*8:636+r()*60;tuft(x,y,5+r()*8,mix(b.grass,b.ground[1],r()*.6))}
 // far side dressing: stakes, signpost, cart
 c.strokeStyle=b.ink;c.lineCap='round';
 c.strokeStyle=mix(b.ink,'#6b4a2a',.45);for(let i=0;i<6;i++){const x=676+i*19+((i*7)%5);c.lineWidth=3.2;c.beginPath();c.moveTo(x,570);c.lineTo(x+15,545-((i*5)%7));c.stroke()}c.lineWidth=2.4;c.beginPath();c.moveTo(672,562);c.lineTo(792,560);c.stroke();c.strokeStyle=b.ink;
 c.lineWidth=3;c.beginPath();c.moveTo(1094,568);c.lineTo(1094,524);c.stroke();c.fillStyle=b.ink;c.beginPath();c.moveTo(1076,528);c.lineTo(1108,526);c.lineTo(1116,533);c.lineTo(1108,540);c.lineTo(1076,540);c.closePath();c.fill();
 for(const x of[1170,1205]){c.lineWidth=2.5;c.beginPath();c.moveTo(x,570);c.lineTo(x+2,522);c.stroke();c.beginPath();c.arc(x+2,518,5.5,0,TAU);c.fill();c.fillStyle=rgba('#ff5a3d',.9);c.fillRect(x,516,1.6,1.6);c.fillRect(x+3,516,1.6,1.6);c.fillStyle=b.ink}
 if(bi===2){for(let i=0;i<18;i++){const x=WALL_X+10+r()*(W-WALL_X-10),y=r()<.5?568+r()*6:640+r()*50;c.fillStyle=rgba('#ffffff',.55);c.beginPath();c.ellipse(x,y,16+r()*30,4+r()*4,0,Math.PI,0);c.fill()}}
 if(bi===3){c.lineWidth=1.6;for(let i=0;i<16;i++){let x=WALL_X+20+r()*(W-WALL_X-40),y=r()<.5?570+r()*8:640+r()*50;c.strokeStyle=rgba('#ff7a2a',.75);c.beginPath();c.moveTo(x,y);for(let k=0;k<4;k++){x+=6+r()*14;y+=(r()-.5)*6;c.lineTo(x,y)}c.stroke()}}
 if(bi===4){for(let i=0;i<30;i++){const x=WALL_X+20+r()*(W-WALL_X-40),y=r()<.5?566+r()*8:640+r()*50;c.fillStyle=rgba('#c77dff',.85);c.beginPath();c.arc(x,y,1.5+r()*2,Math.PI,0);c.fill();c.fillRect(x-.6,y,1.2,4)}}

 // foreground grass blades (animated)

/* current sky palette */
R.computeSky=function(){
 const b=BIOMES[G.biome],sun=G.sun,night=G.night;
 const dk=sun<.2?1-sun/.2:sun>.72?(sun-.72)/.28:0,d=smooth(clamp(dk,0,1));

 c.drawImage(this.castleCv,-10,80,340+WX,560);
 const t=this.t;
 // banners
 for(const f of this.flags){
  c.strokeStyle='#22202a';c.lineWidth=2;c.beginPath();c.moveTo(f.x,f.y+2);c.lineTo(f.x,f.y-f.h);c.stroke();
  const len=f.big?34:24,hh=f.big?17:13,y0=f.y-f.h+1;
  c.beginPath();for(let i=0;i<=8;i++){const u=i/8,wy=Math.sin(t*4-u*5+f.x)*3.2*u;c.lineTo(f.x+u*len,y0+wy)}
  for(let i=8;i>=0;i--){const u=i/8,wy=Math.sin(t*4-u*5+f.x)*3.2*u;c.lineTo(f.x+u*len-(i===8?7:0),y0+hh+wy-(i===8?hh/2:0))}
  c.closePath();c.fillStyle='#2e63c9';c.fill();c.fillStyle='#f2c14e';c.beginPath();c.arc(f.x+len*.36,y0+hh/2+Math.sin(t*4-1.8+f.x)*1.2,f.big?4:3,0,TAU);c.fill();
 }
 // flames
 for(const tc of this.torches){
  const fl=1+Math.sin(t*17+tc.x)*.12+Math.sin(t*29+tc.y)*.08,s=tc.brazier?1.6:1;
  c.fillStyle='#ff8a2a';c.beginPath();c.ellipse(tc.x,tc.y-5*s,3.6*s,7*s*fl,0,0,TAU);c.fill();
  c.fillStyle='#ffe08a';c.beginPath();c.ellipse(tc.x,tc.y-3.5*s,1.8*s,4*s*fl,0,0,TAU);c.fill();
  this.light(tc.x,tc.y-6,(tc.brazier?150:95)*fl,'#ff9a3c',.9);
  if(chance(.06))FX.p({x:tc.x,y:tc.y-8,vx:rand(-8,8),vy:-rand(25,50),g:-20,life:rand(.4,.9),size:1.2,col:'#ffb04d',add:1});
 }
 for(const w of this.windows)this.light(w.x,w.y,34,'#ffc56b',.55);
 // battle damage

 if(hp<.75){
  const a=clamp((0.75-hp)/.5,0,1),r=mulberry(99);c.strokeStyle=rgba('#0d0b12',.75*a+.1);c.lineWidth=1.8;c.lineCap='round';
  const n=3+Math.floor(a*9);

  if(hp<.35&&chance(.25))FX.smoke(rand(140,WALL_X),WALL_TOP+rand(0,60),1,'#1d1a22',1.2);
 }
};

/* ---------- weather ---------- */
R.weatherTick=function(dt){
 const kind=BIOMES[G.biome].weather,wx=this.wx,n=G.night;
 let want=kind==='snow'?150:kind==='leaves'?34:kind==='embers'?70:kind==='spores'?60:26;
 if(this.lowFx)want=want>>1;
 while(wx.length<want)wx.push(this.newWx(kind,true));
 if(wx.length>want)wx.length=want;
 for(let i=0;i<wx.length;i++){const p=wx[i];
  if(p.k!==kind){wx[i]=this.newWx(kind,true);continue}
  p.t+=dt;
  if(kind==='snow'){p.y+=p.v*dt;p.x+=(Math.sin(p.t*1.3+p.p)*18-22)*dt}
  else if(kind==='leaves'){p.y+=p.v*dt;p.x-=(40+Math.sin(p.t*2+p.p)*30)*dt;p.r+=dt*3}
  else if(kind==='embers'){p.y-=p.v*dt;p.x+=Math.sin(p.t*2+p.p)*20*dt-12*dt}
  else{p.x+=Math.sin(p.t*.7+p.p)*14*dt-6*dt;p.y+=Math.cos(p.t*.9+p.p)*10*dt}
  if(p.y>H+10||p.y<-20||p.x<-20||p.x>W+30)wx[i]=this.newWx(kind,false);
 }
 // storm rain on boss waves
 this.rain=lerp(this.rain||0,(G.phase==='wave'&&G.waveInfo&&G.waveInfo.boss&&G.biome<2)?1:0,dt*.6);
 if(this.rain>.4&&chance(dt*.18)){FX.flash('#cfe0ff',.22);SFX.thunder()}
};
R.newWx=function(k,any){
 const p={k,t:rand(10),p:rand(TAU),s:rand(1,2.6),v:rand(30,80),r:rand(TAU),x:rand(W+60),y:any?rand(H):-10};
 if(k==='embers'){p.y=any?rand(H):H+5;p.v=rand(30,90)}
 if(k==='pollen'||k==='spores'){p.y=rand(360,H);p.x=any?rand(W):W+10}
 if(k==='leaves'){p.x=any?rand(W):W+rand(20);p.y=any?rand(H):rand(-10,400);p.c=pick(['#d9702a','#c9482a','#e0a030'])}
 return p;
};

  if(kind==='snow'){c.globalAlpha=.75;c.fillStyle='#fff';c.fillRect(p.x,p.y,p.s,p.s)}
  else if(kind==='leaves'){c.globalAlpha=.85;c.fillStyle=p.c;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillRect(-3,-1.4,6,2.8);c.restore()}

  else{const gl=Math.max(0,Math.sin(p.t*1.6+p.p));
   if(n>.4){c.globalAlpha=gl*n;c.fillStyle='#e6ff7a';c.beginPath();c.arc(p.x,p.y,1.6,0,TAU);c.fill();c.globalAlpha=gl*n*.25;c.beginPath();c.arc(p.x,p.y,6,0,TAU);c.fill()}

/* ---------- lighting: darkness with holes cut by every light ---------- */
R.applyDark=function(target){
 const l=this.lctx,d=this.dark;
 l.globalCompositeOperation='source-over';l.clearRect(0,0,W/2,H/2);
 l.fillStyle=css(this.darkCol,d);l.fillRect(0,0,W/2,H/2);
 l.globalCompositeOperation='destination-out';
 const A=this.L;
 const cut=(x,y,r,int)=>{x*=.5;y*=.5;r*=.5;const g=l.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(0,0,0,'+Math.min(1,.9*int)+')');g.addColorStop(.5,'rgba(0,0,0,'+.42*int+')');g.addColorStop(1,'rgba(0,0,0,0)');l.fillStyle=g;l.fillRect(x-r,y-r,r*2,r*2)};
 for(let i=0;i<A.length;i+=5)cut(A[i],A[i+1],A[i+2],A[i+4]);
 for(const f of FX.lights)cut(f.x,f.y,f.r,f.int*(f.life/f.max));
 target.save();target.globalCompositeOperation='source-atop';target.drawImage(this.lcv,0,0,W,H);target.restore();
};
R.drawGlows=function(c){
 const k=.10+this.dark*.42,A=this.L;
 c.globalCompositeOperation='lighter';
 const glow=(x,y,r,col,int)=>{const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,k*int));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)};
 for(let i=0;i<A.length;i+=5)glow(A[i],A[i+1],A[i+2]*.9,A[i+3],A[i+4]);
 for(const f of FX.lights)glow(f.x,f.y,f.r,f.col,f.int*(f.life/f.max)*1.6);
 c.globalCompositeOperation='source-over';
};

function ik(ax,ay,bx,by,l1,l2,dir){
 let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);const mx=l1+l2-.01;
 if(d>mx){dx*=mx/d;dy*=mx/d;d=mx}if(d<.01){dx=.01;d=.01}
 const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
 return[ax+dx*a/d-dir*h*dy/d,ay+dy*a/d+dir*h*dx/d,ax+dx,ay+dy];
}

 avail.forEach(k=>{if(ENEMIES[k].from===n&&n>1){const c=Math.max(1,Math.round(budget*.28/ENEMIES[k].cost));for(let i=0;i<Math.min(c,caps[k]||99);i++)add(k)}});
 let guard=0;
 while(budget>=1&&guard++<3000){
  let tot=0;const ok=avail.filter(k=>ENEMIES[k].cost<=budget+.4&&(cnt[k]||0)<(caps[k]||999));if(!ok.length)break;

/* ---------- per-frame update ---------- */
function update(dt){
 G.time+=dt;
 for(let i=G.timers.length-1;i>=0;i--){const t=G.timers[i];t.t-=dt;if(t.t<=0){G.timers.splice(i,1);t.fn()}}
 const ph=G.phase;
 // sky clock
 if(ph==='wave'){G.night=Math.max(0,G.night-dt*.9);G.sun=lerp(G.sun,clamp(.08+.86*(G.waveT/(G.waveInfo.dur+14)),.08,.96),dt*.8)}
 else if(ph==='build'){G.night=Math.min(1,G.night+dt*.45);G.sun=Math.min(1,G.sun+dt*.05)}
 else if(ph==='defeat'){G.defeatT+=dt}
 for(const id in G.cd)if(G.cd[id]>0)G.cd[id]=Math.max(0,G.cd[id]-dt);
 if(G.smiteIdle<9)G.smiteIdle+=dt;if(G.wrathLock>0)G.wrathLock-=dt;
 if(G.buffs.rally>0)G.buffs.rally-=dt;
 if(ph==='build'&&G.auto&&G.autoT>0&&!G.relicChoice){G.autoT-=dt;if(G.autoT<=0)startWave()}
 if(ph==='wave'){
  G.waveT+=dt;G.stats.time+=dt;
  while(G.queue.length&&G.queue[0].t<=G.waveT){const q=G.queue.shift();spawnEnemy(q.k,{elite:q.elite});G.spawned++}
  if(M.regen)G.wallHp=Math.min(G.wallMax,G.wallHp+G.wallMax*M.regen*dt);
 }
 if(ph==='wave'||ph==='defeat'){updEnemies(dt);updAllies(dt);updRiders(dt)}
 if(ph==='wave'||ph==='build')updUnits(dt);
 updProj(dt);updZones(dt);
 if(G.buffs.storm>0&&ph==='wave'){
  G.buffs.storm-=dt;G.buffs.stormT-=dt;
  for(let i=0;i<3;i++){const x=rand(WALL_X+20,W),y=rand(-20,GROUND);FX.p({x,y,vx:-120,vy:900,life:(GROUND+16-y)/900,size:1.6,col:'#e8eefc',shape:1})}
  if(G.buffs.stormT<=0){G.buffs.stormT=.25;const dm=4.5*powMul()*(M.blot?2:1);SFX.arrow();for(const e of G.enemies)if(targetable(e)){hurt(e,dm,'phys',null,{ap:.5,proj:1,tag:'power'});if(chance(.3))FX.spark(e.x,ecy(e),2,'#fff',80)}}
 }
 // chests age
 for(const ch of G.chests)ch.t+=dt;
 // remove the dead, check for the end of the wave
 if(G.enemies.length){let w=0;for(const e of G.enemies)if(!e.dead)G.enemies[w++]=e;G.enemies.length=w}
 if(ph==='wave'&&!G.queue.length&&!G.enemies.length&&G.wallHp>0)endWave();
}
function updEnemies(dt){
 const dead=G.phase==='defeat';
 for(const e of G.enemies){
  if(e.dead)continue;const d=e.d;
  e.t+=dt;if(e.flash>0)e.flash-=dt;if(e.flashCd>0)e.flashCd-=dt;if(e.spawnT>0)e.spawnT-=dt;if(e.cast>0)e.cast-=dt*1.6;
  if(e.dn>0){e.dnT-=dt;if(e.dnT<=0){if(e.dnCrit||e.dn>=Math.max(4,e.max*.05))FX.text(e.x,ecy(e)-e.bh*.5-6,fmt(Math.max(1,e.dn)),e.dnCrit?'#ffd166':'#ffffff',e.dnCrit?19:13,e.dnCrit);e.dn=0;e.dnCrit=0;e.dnT=.35}}
  if(e.burnT>0){e.burnT-=dt;hurt(e,e.burnDps*dt,'fire',e.burnSrc,{dot:1,tag:'burn'});if(e.dead)continue}
  if(e.poisonT>0){e.poisonT-=dt;hurt(e,e.poisonDps*dt,'poison',e.poisonSrc,{dot:1});if(e.dead)continue}
  if(e.slowT>0)e.slowT-=dt;else e.slow=0;
  if(e.shredT>0)e.shredT-=dt;if(e.inGold>0&&e.poisonT<=0)e.inGold=0;
  if(e.kb){e.x+=e.kb*dt;e.kb*=Math.pow(.01,dt);if(Math.abs(e.kb)<6)e.kb=0}
  if(d.phase){e.phT-=dt;if(e.phT<=0){e.phased=!e.phased;e.phT=e.phased?1.3:2.8}}
  if(e.stunImm>0)e.stunImm-=dt;
